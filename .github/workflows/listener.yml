name: Listener

# The real microphone path: Chromium plays a recitation into a fake capture
# device and the application downloads and runs its speech model. That is a
# ~220MB download on a cold cache and minutes of WebAssembly inference, so it
# is kept off the pull-request gate and run on a schedule, or by hand.
#
# It gates its own job properly: no continue-on-error, no retries, no skips.

on:
  workflow_dispatch:
    inputs:
      cold-cache:
        description: 'Ignore the cached model and download it again'
        type: boolean
        default: false
  schedule:
    # Nightly, a little after midnight UTC.
    - cron: '17 1 * * *'

permissions:
  contents: read

concurrency:
  group: listener-${{ github.ref }}
  cancel-in-progress: true

jobs:
  listener:
    name: Real microphone path
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts

      # The key names the exact model revision and the recitation, so a change
      # to either fetches fresh bytes instead of trusting a stale cache.
      - name: Work out the fixture cache key
        id: fixtures
        run: echo "key=$(node scripts/listener-fixtures.mjs key)" >> "$GITHUB_OUTPUT"

      - name: Restore the model and the recitation
        if: ${{ !inputs.cold-cache }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/listener
          key: ${{ runner.os }}-${{ steps.fixtures.outputs.key }}

      # ffmpeg converts the recitation to the 16-bit WAV the fake device reads.
      # Both this and the model download are skipped when the cache was warm.
      - name: Fetch the recitation
        run: node scripts/listener-fixtures.mjs audio

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # The full browser, not the headless shell: only it has media capture.
      - run: npx playwright install --with-deps chromium

      - run: npx next build
        env:
          NEXT_DIST_DIR: .next-e2e

      - run: npx playwright test --project=listener
        id: listener

      - if: failure() && steps.listener.conclusion == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: listener-report
          # The report and traces only. The mirrored model stays on the runner:
          # it is 220MB and it is not a diagnostic.
          path: |
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 7
