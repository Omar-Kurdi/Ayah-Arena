name: CI

# The pull-request gate, in two jobs:
#
#   Fast checks    the same checks `npm run verify` runs locally, in one job
#                  so dependencies are installed once. No browser, no model.
#   Browser tests  the Playwright suites against a production build.
#
# The real microphone path is slow and needs a ~220MB model, so it lives in
# listener.yml and runs nightly or by hand -- never on a pull request.
#
# Steps call the project's npm scripts, so what CI runs is what you can run.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Fast checks
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit: a tag can be moved under us.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          # Nothing here pushes, so the runner keeps no git credentials.
          persist-credentials: false

      # Node 22 LTS: the app stores progress in node:sqlite, which needs 22.5
      # or newer. Local development runs a later Node; this pins the floor CI
      # holds the project to.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      # --ignore-scripts: dependency lifecycle scripts do not run on the
      # runner. This job only needs the source tree on disk, and the native
      # packages those scripts fetch (sharp, onnxruntime-node) are not used
      # by any check here.
      - run: npm ci --ignore-scripts

      - run: npm run typecheck

      - run: npm run lint

      # Grading, normalization and glyph alignment over all 6,236 ayat.
      - run: npm run check

      # Unit tests: pure logic only, no browser, server, database or network.
      - run: npm test

      # Dependency vulnerabilities, kept separate from Skylos: Skylos 4.37.0
      # cannot resolve this project's caret ranges (see .skylos/REVIEW.md), so
      # npm audit is the dependency gate.
      - run: npm run audit:prod

      # Skylos is a developer CLI, not a project dependency, so it is installed
      # the same way as locally: pipx, pinned to the version the baseline was
      # reviewed against.
      - name: Install Skylos
        run: |
          pipx install skylos==4.37.0
          skylos --version

      # scripts/skylos-baseline.mjs rebuilds .skylos/baseline.json (gitignored,
      # absolute paths for this runner) from the committed portable baseline,
      # then runs the strict gate. The baseline is never regenerated here: a new
      # finding has to fail, not be quietly accepted.
      - name: Skylos baseline gate
        run: npm run skylos

      # The gate is only trustworthy if the run left the reviewed baseline
      # alone and kept the generated one out of the repository.
      - name: Baseline was not modified by the run
        run: git diff --exit-code -- .skylos/baseline.portable.json

      # Integration tests: the real route handlers and real SQLite, each test
      # against its own throwaway database. Last, because they are the slowest
      # of the fast checks and the cheapest signals should fail first.
      - run: npm run test:integration

      - name: Generated baseline stays untracked
        run: |
          git check-ignore -q .skylos/baseline.json
          test -z "$(git status --porcelain)" || {
            echo 'CI changed tracked files:'
            git status --porcelain
            exit 1
          }

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts

      # Chromium only: one engine, and the browser download is the slow part of
      # this job, so it is cached against the Playwright version in the lockfile.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium

      # The production build the tests run against, in its own directory.
      # Separate from the test step so a broken build is not reported as a
      # test failure, and does not try to upload a report that cannot exist.
      - run: npm run build:e2e

      # Playwright starts the server itself, with a throwaway database
      # directory it creates and removes; axe runs inside the same suite. The
      # script names the projects, so this cannot drift into running the
      # listener suite, which needs a model and a fake microphone.
      - run: npm run test:e2e:run
        id: e2e

      # Only when the tests themselves failed, so the report and traces are
      # there to upload: missing files then mean something is wrong, and the
      # step says so rather than uploading nothing.
      - if: failure() && steps.e2e.conclusion == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 7
